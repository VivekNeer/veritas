# =============================================================================
# reference_ranges.yaml
# =============================================================================
# Medically accepted reference ranges (FR-3.1) and physiological plausibility
# bounds (FR-3.2), keyed on canonical test names from test_dictionary.yaml.
#
# FOUR BOUNDS PER TEST — the distinction is the point of FR-3.2:
#
#   outlier_low .... low ......... high ........ outlier_high
#        |            |             |                 |
#   [ Outlier ][ Below Range ][Within Range][ Above Range ][ Outlier ]
#
#   low / high            -> clinically normal interval. Outside = abnormal
#                            but real; a doctor acts on it.
#   outlier_low / high    -> physiologically implausible. A haemoglobin of
#                            0.1 or 999 is not a sick patient, it is bad data.
#                            Different signal, different downstream action.
#
# ---------------------------------------------------------------------------
# WHY CONFIG RANGES OVERRIDE SOURCE-PROVIDED RANGES
# ---------------------------------------------------------------------------
# The samples' own `range` field is unreliable: single values where an
# interval is expected ("1.31"), ranges from a different analyte
# ("4000-10000" on a haemoglobin row), and unfilled template text ("range").
# Validation therefore uses this file as the authority. The original is
# always retained in range_text_original, and disagreement between the two is
# itself flagged as a quality signal. See ASSUMPTIONS.md.
#
# ---------------------------------------------------------------------------
# SCOPE NOTE
# ---------------------------------------------------------------------------
# These are general adult reference intervals, sufficient for a prototype.
# Production requires age-, sex- and method-stratified intervals sourced from
# the performing laboratory, since intervals are assay-dependent and not
# universally transferable. Several samples are paediatric, where adult
# intervals genuinely do not apply — this is a stated limitation, not an
# oversight. See ASSUMPTIONS.md > Data Assumptions.
# =============================================================================

version: 1
population: adult_general
units_note: "All bounds expressed in the canonical_unit from test_dictionary.yaml."

# -----------------------------------------------------------------------------
# CLASSIFICATION CASCADE (FR-3.3)
# Evaluated top to bottom; first match wins. Order matters: an implausible
# value must be caught as Outlier before it is reported as Above Range.
# -----------------------------------------------------------------------------
classification:
  precedence:
    - condition: is_template_or_junk_row
      result: "Invalid"
    - condition: test_name_unresolved
      result: "Invalid"
    - condition: unit_test_mismatch
      result: "Invalid"
    - condition: result_equals_range_text        # "1.5-4.5" leaked into result
      result: "Invalid"
    - condition: is_narrative_test
      result: "Not Applicable"
    - condition: is_qualitative_test
      result: "Qualitative"
    - condition: result_value_is_null
      result: "Invalid"
    - condition: no_reference_range_defined
      result: "Invalid"
    - condition: value_below_outlier_low
      result: "Outlier"
    - condition: value_above_outlier_high
      result: "Outlier"
    - condition: value_below_low
      result: "Below Range"
    - condition: value_above_high
      result: "Above Range"
    - condition: default
      result: "Within Range"

  # The brief's FR-3.3 enumerates five values. Two extra states are emitted
  # for tests that are non-numeric BY DESIGN — marking a dengue antigen
  # "Invalid" for not being a number would be wrong and would flood the ops
  # queue with noise. Both are documented in ASSUMPTIONS.md.
  permitted_values:
    - "Within Range"
    - "Above Range"
    - "Below Range"
    - "Outlier"
    - "Invalid"
    - "Qualitative"        # extension
    - "Not Applicable"     # extension

  boundary_handling: inclusive    # value == low or == high is Within Range

# =============================================================================
# RANGES
# =============================================================================
