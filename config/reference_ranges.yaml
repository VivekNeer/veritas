# -----------------------------------------------------------------------------
# SOURCE-RANGE COMPARISON
# We validate against this file, but the source's own range is still parsed
# into range_low / range_high and compared. Systematic disagreement for one
# source is a strong upstream data-quality signal and appears in the UI's
# per-source quality tab (FR-5.4).
# -----------------------------------------------------------------------------
source_range_comparison:
  enabled: true
  authority: config              # config | source
  tolerance_pct: 10
  on_disagreement:
    flag: source_range_disagrees_with_canonical
    action: flag_only            # never overwrite; both are retained
  malformed_source_range:
    single_value_pattern: '^\s*[\d.]+\s*$'      # "1.31" where an interval is due
    flag: source_range_malformed

# -----------------------------------------------------------------------------
# DEFAULTS for canonical tests with no range defined here
# -----------------------------------------------------------------------------
defaults:
  when_no_range_defined:
    set_analytics: "Invalid"
    flag: no_reference_range_configured
    emit_to_review_queue: true
    # Adding a range for a new test is a config-only change (NFR-2.1).
