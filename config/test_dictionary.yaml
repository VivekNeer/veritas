# =============================================================================
# QUALITATIVE TESTS
# Non-numeric by nature. Must NOT be classified Invalid merely for lacking a
# numeric result — FR-3.4 targets numeric-expected fields, not these.
# =============================================================================
qualitative_tests:
  expected_values: ["POSITIVE", "NEGATIVE", "REACTIVE", "NON-REACTIVE",
                    "DETECTED", "NOT DETECTED", "PRESENT", "ABSENT",
                    "NIL", "TRACE", "NORMAL", "ABNORMAL"]
  tests:
    DENGUE_NS1:
      variants: ["DENGUE NS 1", "DENGUE NS1", "NS1 ANTIGEN"]
    MALARIA_VIVAX_ANTIGEN:
      variants: ["MALARIA VIVAX ANTIGEN , WHOLE BLOOD EDTA", "MALARIA VIVAX ANTIGEN"]
    MALARIA_FALCIPARUM_ANTIGEN:
      variants: ["MALARIA FALCIPARUM ANTIGEN , WHOLE BLOOD EDTA", "MALARIA FALCIPARUM ANTIGEN"]
    PERIPHERAL_SMEAR_MALARIAL_PARASITE:
      variants: ["PERIPHERAL SMEAR FOR MALARIAL PARASITE (MP) , WHOLE BLOOD EDTA"]
    TYPHIDOT_IGG_IGM:
      variants: ["TYPHIDOT IgG AND IgM , SERUM", "TYPHIDOT IgG AND IgM, SERUM",
                 "TYPHI DOT IGG & IGM", "TYPHIDOT"]
    SALMONELLA_TYPHI_O:
      variants: ["SALMONELLA TYPHI O` , SERUM", "SALMONELLA TYPHI O"]
    SALMONELLA_TYPHI_H:
      variants: ["SALMONELLA TYPHI 'H' , SERUM", "SALMONELLA TYPHI H"]
    SALMONELLA_PARATYPHI_AH:
      variants: ["S.PARATYPHI A 'H' , SERUM", "S.PARATYPHI A H"]
    SALMONELLA_PARATYPHI_BH:
