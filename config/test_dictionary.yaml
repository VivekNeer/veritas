# Variants below are drawn from BOTH the supplied reference dictionary AND the
# actual strings observed across the 5 sample files (203 distinct test names).
# Truncated variants (aemoglobin, tal WBC Count) are OCR artefacts and are the
# clearest demonstration of fuzzy matching earning its place.
# =============================================================================
