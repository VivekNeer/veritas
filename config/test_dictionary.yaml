    BLOOD_CULTURE:
      variants: ["CULTURE AND SENSITIVITY - AEROBIC (BLOOD)", "BLOOD CULTURE"]
    URINE_ROUTINE:
      variants: ["Urine routine and microscopic examination", "urine R/M",
                 "COMPLETE URINE EXAMINATION (CUE)", "URINE R/M"]

# =============================================================================
# IMAGING / NARRATIVE
# Free-text findings. Retained in result_text; never numeric.
# =============================================================================
narrative_tests:
  # Imaging and examination findings
  variants:
    - "ULTRASOUND WHOLE ABDOMEN"
    - "USG WHOLE ABDOMEN"
    - "USG W/A"
    - "Chest"
    - "CVS"
    - "P/A"
    - "Diet"
    - "Comment"
    - "DIAGNOSTICS"

  # Presenting symptoms recorded in the observation chart, not measurements.
  symptoms:
    - "Fever"
    - "Vomiting"
    - "Headache"
    - "Pain abdomen"
    - "Reduced oral intake"
    - "Generalized weakness"

  # Nursing observation-chart items. Numeric, but with no clinical reference
  # interval — classified Not Applicable rather than Invalid so they do not
  # flood the ops review queue.
  nursing_chart:
    - "Total Intake"
    - "Total Output"
    - "Weight"
    - "Supplement 0,Lt."
    - "BE"

  analytics_override: "Not Applicable"

# =============================================================================
# UNRESOLVED HANDLING (feeds NFR-4.1: >=98% variant coverage)
# =============================================================================
unresolved_handling:
  action: flag_and_retain          # never silently drop
  set_canonical: null
  set_analytics: "Invalid"
  set_method: "unresolved"
  record_best_candidate: true      # store nearest match + score for ops triage
  emit_to_review_queue: true
  # Ops review of this queue -> dictionary update -> re-run is the production
  # loop that reaches the 98% coverage target. Vertex AI text embeddings would
  # replace the fuzzy tier at scale; see architecture notes.
