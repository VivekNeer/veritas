# =============================================================================
# test_dictionary.yaml
# =============================================================================
# Canonical test names and their known variants (FR-2.1).
#
# Resolution is three-tier, and the tier that fired is recorded on every row:
#   1. exact      -> variant matched verbatim (after normalisation)   conf 1.00
#   2. fuzzy      -> rapidfuzz score >= threshold                     conf score/100
#   3. unresolved -> below threshold; canonical null, analytics Invalid
# This populates normalization_method / normalization_confidence in the
# output schema.
#
# -----------------------------------------------------------------------------
# COLLISIONS IN THE SUPPLIED REFERENCE (Clinical_name_standardization.pdf)
# -----------------------------------------------------------------------------
# The supplied dictionary is internally inconsistent and has been reconciled
# here rather than propagated:
#
#   * HAEMOGLOBIN and HEMOGLOBIN listed as SEPARATE canonical names, BOTH
#     claiming "Hb" as a variant -> ambiguous mapping. Merged into one
#     canonical entry (HEMOGLOBIN); British spelling is a variant, not a
#     separate analyte.
#   * CREATININE and "Serum Creatinine" listed separately -> same analyte,
#     specimen qualifier only. Merged into CREATININE.
#   * Casing is mixed (SODIUM vs Platelet Count). Normalised to UPPER
#     throughout for consistent grouping.
#
# Production would resolve against LOINC rather than an ad-hoc dictionary.
# See ASSUMPTIONS.md > Data Assumptions.
# =============================================================================

version: 1

matching:
  fuzzy_threshold: 85              # rapidfuzz score below which -> unresolved
  fuzzy_scorer: token_set_ratio    # tolerates reordering and extra qualifiers
  case_sensitive: false

  # Applied before matching. Critical for this dataset: method annotations
  # ("(whole blood/photometric method)") otherwise dominate the score.
  preprocessing:
    strip_whitespace: true
    collapse_internal_spaces: true
    strip_trailing_punctuation: true
    strip_specimen_suffixes: [", SERUM", ", WHOLE BLOOD EDTA", ", RANDOM", " SERUM"]
    strip_method_annotations: true
    method_annotation_pattern: '\((whole blood|automated|light microscopy|visual observation|calculated|calculalod|impedence|impedenco|photometric|multistrips)[^)]*\)'

  # Test names carrying their own result: "Na + (127)", "KFT - sr creatinine - 0.3"
  embedded_value_extraction:
    enabled: true
    patterns:
      - '^(?P<name>[^(]+)\((?P<value>[\d.]+)\)$'      # Na + (127)
      - '^(?P<name>.+?)\s*-\s*(?P<value>[\d.]+)$'      # KFT - sr creatinine - 0.3
    # Only used when the row's own result field is empty.
    use_when_result_empty: true
    set_method: extracted
    set_confidence: 0.70
    flag: value_recovered_from_test_name

  # Multi-analyte strings: "LFT ( SGOT - 38, SGPT -14, ALP - 127)"
  composite_row_detection:
    enabled: true
    min_embedded_values: 2
    action: flag_only          # do not split; flag for ops review
    flag: composite_multi_analyte_row

# =============================================================================
