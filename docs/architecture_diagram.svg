<svg viewBox="0 0 1400 780" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Veritas Claims pipeline: JSON lands in GCS, is parsed and deduplicated by ingestion, standardised and validated through four stages driven by config/*.yaml, then loaded idempotently into BigQuery's standardised_records table (with failures from either ingestion or transform routed to dead_letter), and read by the Streamlit ops UI.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrowConfig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowError" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="780" fill="#ffffff"/>

  <!-- Band headers -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="1">
    <text x="90"   y="35" text-anchor="middle">SOURCES</text>
    <text x="295"  y="35" text-anchor="middle">INGESTION</text>
    <text x="700"  y="35" text-anchor="middle">STANDARDISATION + VALIDATION</text>
    <text x="1125" y="35" text-anchor="middle">STORAGE</text>
    <text x="1318" y="35" text-anchor="middle">CONSUMPTION</text>
  </g>

  <!-- Band 1: Sources -->
  <rect x="20" y="185" width="140" height="70" rx="6" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="90" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">Clinics / Labs /</text>
  <text x="90" y="229" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">Hospitals</text>
  <text x="90" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280">500+ sources</text>
  <text x="90" y="284" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280">200k+ JSON/day</text>

  <line x1="160" y1="220" x2="215" y2="220" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Band 2: Ingestion -->
  <rect x="220" y="70" width="150" height="70" rx="6" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="295" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">GCS bucket</text>
  <text x="295" y="118" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280">raw JSON envelopes</text>

  <line x1="295" y1="140" x2="295" y2="185" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="305" y="165" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280">list &amp; read</text>

  <rect x="220" y="190" width="150" height="80" rx="6" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="295" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">Ingestion</text>
  <text x="295" y="233" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280">envelope parse,</text>
  <text x="295" y="247" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280">fan-out, 2-level dedup</text>

  <line x1="370" y1="230" x2="415" y2="230" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="373" y="222" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280">per record</text>

  <!-- Ingestion dead-letter -->
  <line x1="295" y1="270" x2="295" y2="558" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowError)"/>
  <text x="303" y="420" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#dc2626">malformed JSON,</text>
  <text x="303" y="434" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#dc2626">unknown classifier</text>

  <!-- Band 3: Transform (bordered box) -->
  <rect x="420" y="55" width="560" height="325" rx="8" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="2,3"/>
  <text x="445" y="72" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#374151">TRANSFORM (pure functions)</text>

  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">
    <rect x="445" y="85" width="510" height="58" rx="5" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <text x="700" y="108" text-anchor="middle">1. Test name resolution</text>
    <text x="700" y="126" text-anchor="middle" font-size="10" fill="#6b7280">exact -&gt; fuzzy -&gt; unresolved, method + confidence recorded</text>

    <line x1="700" y1="143" x2="700" y2="155" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="445" y="155" width="510" height="58" rx="5" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <text x="700" y="178" text-anchor="middle">2. Numeric + unit harmonisation</text>
    <text x="700" y="196" text-anchor="middle" font-size="10" fill="#6b7280">result_value extraction, alias/factor conversion, mismatch flagging</text>

    <line x1="700" y1="213" x2="700" y2="225" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="445" y="225" width="510" height="58" rx="5" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <text x="700" y="248" text-anchor="middle">3. Demographic normalisation</text>
    <text x="700" y="266" text-anchor="middle" font-size="10" fill="#6b7280">age / gender / date, [X REDACTED] detection</text>

    <line x1="700" y1="283" x2="700" y2="295" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="445" y="295" width="510" height="58" rx="5" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <text x="700" y="318" text-anchor="middle">4. Range + outlier classification</text>
    <text x="700" y="336" text-anchor="middle" font-size="10" fill="#6b7280">Within / Above / Below / Outlier / Invalid cascade</text>
  </g>

  <!-- Transform output -> BigQuery (both centered at y=220 for a clean straight arrow) -->
  <line x1="980" y1="220" x2="1045" y2="220" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Transform dead-letter (offset from the config arrows below, bends left into the shared dead_letter box) -->
  <polyline points="900,380 900,520 340,520 340,558" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowError)"/>
  <text x="770" y="513" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#dc2626">template rows, panel headers,</text>
  <text x="770" y="527" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#dc2626">non-clinical strings</text>

  <!-- Band 4: Storage -->
  <rect x="1050" y="185" width="150" height="70" rx="6" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="1125" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">BigQuery</text>
  <text x="1125" y="233" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280">canonical warehouse</text>

  <line x1="1125" y1="255" x2="1125" y2="558" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1133" y="410" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2937">MERGE on</text>
  <text x="1133" y="424" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2937">deterministic id</text>

  <rect x="1050" y="560" width="150" height="55" rx="5" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="1125" y="583" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">standardised_</text>
  <text x="1125" y="599" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">records</text>

  <rect x="220" y="560" width="150" height="55" rx="5" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="295" y="583" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#dc2626">dead_letter</text>
  <text x="295" y="599" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#dc2626">raw_json + reason</text>

  <!-- Band 5: Consumption -->
  <line x1="1200" y1="220" x2="1258" y2="220" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1263" y="185" width="115" height="70" rx="6" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="1320" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">Streamlit</text>
  <text x="1320" y="233" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280">Ops UI</text>

  <!-- Cross-cutting: config, driving every transform stage -->
  <rect x="445" y="650" width="510" height="55" rx="5" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <text x="700" y="673" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2563eb">config/*.yaml</text>
  <text x="700" y="690" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2563eb">4 files — every mapping decision, zero code change</text>

  <line x1="550" y1="650" x2="550" y2="383" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowConfig)"/>
  <line x1="700" y1="650" x2="700" y2="383" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowConfig)"/>
  <line x1="850" y1="650" x2="850" y2="383" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowConfig)"/>
  <text x="960" y="630" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2563eb" font-weight="700">drives every stage</text>
  <text x="960" y="644" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2563eb" font-weight="700">(NFR-2.1)</text>

  <!-- Legend -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2937">
    <line x1="20" y1="750" x2="55" y2="750" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="62" y="754">data flow</text>

    <line x1="150" y1="750" x2="185" y2="750" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowConfig)"/>
    <text x="192" y="754">config-driven</text>

    <line x1="310" y1="750" x2="345" y2="750" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowError)"/>
    <text x="352" y="754">error / dead-letter</text>
  </g>

  <text x="700" y="10" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">Veritas Claims — Solution Architecture</text>
</svg>
